<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Радион Clicker</title>
    <style>
        :root {
            --bg-dark: #09090b;
            --bg-grad: linear-gradient(135deg, #09090b 0%, #150525 50%, #2b0b42 100%);
            --accent: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.5);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(168, 85, 247, 0.2);
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
        }

        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-grad); background-attachment: fixed; 
            color: var(--text-main); margin: 0; padding: 0; min-height: 100vh; 
            user-select: none; -webkit-tap-highlight-color: transparent;
            overflow-x: hidden; overflow-y: auto; 
        }

        /* Уведомление об ачивке */
        .notification {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: rgba(168, 85, 247, 0.95); backdrop-filter: blur(10px);
            color: #fff; padding: 15px 20px; border-radius: 20px;
            font-weight: 700; font-size: 15px; text-align: center;
            box-shadow: 0 10px 30px rgba(168,85,247,0.5);
            z-index: 1000; width: 90%; max-width: 400px;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        .notification.show { top: 20px; }

        #loadingScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #09090b; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }
        .loading-avatar {
            width: 140px; height: 140px; border-radius: 50%;
            border: 3px solid var(--accent); box-shadow: 0 0 30px var(--accent-glow);
            margin-bottom: 25px; animation: pulse 1.5s infinite ease-in-out alternate;
        }
        .loading-text { font-size: 18px; font-weight: 600; color: var(--accent); letter-spacing: 2px; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 20px var(--accent-glow); } 100% { transform: scale(1.05); box-shadow: 0 0 50px var(--accent-glow); } }

        .header { padding: 30px 20px 10px; text-align: center; }
        .score-badge { font-size: 46px; font-weight: 800; text-shadow: 0 0 20px var(--accent-glow); display: flex; justify-content: center; align-items: center; gap: 8px; }
        .score-badge span { color: #fff; }
        .progress-wrapper {
            margin: 15px auto 0; width: 85%; background: rgba(0,0,0,0.4);
            border-radius: 12px; height: 10px; overflow: hidden; border: 1px solid var(--glass-border);
        }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #8b5cf6, #d946ef); width: 0%; transition: width 0.3s ease; }
        .level-text { font-size: 13px; color: var(--text-muted); margin-top: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        .main-area { display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; padding-bottom: 120px; min-height: calc(100vh - 160px); }
        
        .image-container {
            width: 260px; height: 260px; border-radius: 50%;
            border: 4px solid rgba(168, 85, 247, 0.3); 
            box-shadow: 0 0 50px var(--accent-glow), inset 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden; transition: transform 0.05s; 
            background: #000; margin-bottom: 20px; position: relative; z-index: 2; touch-action: none;
        }
        .image-container:active { transform: scale(0.94); box-shadow: 0 0 70px rgba(217, 70, 239, 0.6); }
        img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

        .stats-pill {
            background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 12px 30px; display: flex; gap: 40px; margin-top: 20px;
        }
        .stat-item { display: flex; flex-direction: column; align-items: center; font-size: 16px; font-weight: 700; color: #fff; }
        .stat-item span { font-size: 11px; color: var(--text-muted); font-weight: 500; margin-bottom: 4px; text-transform: uppercase; }

        .floating-text {
            position: fixed; font-size: 28px; font-weight: 800; color: #d946ef;
            text-shadow: 0 0 10px rgba(217,70,239,0.8); pointer-events: none;
            animation: fly 0.8s ease-out forwards; z-index: 10;
        }
        @keyframes fly { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-100px) scale(1.2); } }

        .secret-spawn {
            position: fixed; width: 75px; height: 75px; border-radius: 50%; border: 3px solid #d946ef;
            box-shadow: 0 0 30px rgba(217,70,239,0.8); z-index: 100;
            background-image: url('5.jpg'); background-size: cover; background-position: center;
            cursor: pointer; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .content-area { display: none; padding: 20px; padding-bottom: 120px; }
        .content-title { text-align: center; font-size: 22px; margin-bottom: 20px; font-weight: 700; color: #fff; }
        
        .card-item {
            background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 16px; 
            padding: 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;
        }
        .card-info h3 { margin: 0 0 6px 0; font-size: 17px; color: #fff; font-weight: 600; }
        .card-info p { margin: 0; color: var(--text-muted); font-size: 13px; }
        
        .buy-btn {
            background: linear-gradient(90deg, #9333ea, #c026d3); color: #fff; border: none; 
            padding: 10px 18px; border-radius: 10px; font-weight: 700; font-size: 14px; 
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4); transition: 0.1s;
        }
        .buy-btn:active:not(:disabled) { transform: scale(0.95); }
        .buy-btn:disabled { background: #27272a; color: #52525b; box-shadow: none; }

        .achieve-status { font-weight: 700; font-size: 14px; text-align: right; }
        .card-item.unlocked { border-color: #d946ef; box-shadow: 0 0 15px rgba(217,70,239,0.15); }
        .card-item.locked { opacity: 0.6; filter: grayscale(50%); }

        .nav-container { position: fixed; bottom: 20px; left: 20px; right: 20px; z-index: 50; }
        .nav { 
            display: flex; background: rgba(9, 9, 11, 0.95); backdrop-filter: blur(20px); 
            border: 1px solid var(--glass-border); border-radius: 20px; padding: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .nav-btn { flex: 1; text-align: center; color: var(--text-muted); font-size: 14px; font-weight: 600; padding: 14px 0; border-radius: 14px; transition: 0.3s; }
        .nav-btn.active { background: rgba(168, 85, 247, 0.15); color: var(--accent); }
    </style>
</head>
<body>

    <div id="loadingScreen">
        <img src="secretphoto.jpg" alt="Secret" class="loading-avatar" onerror="this.src='1.jpg'; this.onerror=null;">
        <div class="loading-text">ЗАГРУЗКА...</div>
    </div>

    <!-- Уведомление -->
    <div id="notifBox" class="notification">🏆 Открыто достижение!</div>

    <div class="header">
        <div class="score-badge"><span id="scoreText">0</span> 💰</div>
        <div class="progress-wrapper"><div class="progress-fill" id="progressBar"></div></div>
        <div class="level-text" id="levelText">Уровень 1</div>
    </div>

    <!-- ИГРА -->
    <div class="main-area" id="gameScreen">
        <div class="image-container" id="tapZone">
            <img id="sergeyImg" src="1.jpg" alt="Радион">
        </div>
        
        <div class="stats-pill">
            <div class="stat-item"><span>За клик</span><div id="clickPowerText">1</div></div>
            <div class="stat-item"><span>В секунду</span><div id="autoPowerText">0</div></div>
        </div>
    </div>

    <!-- МАГАЗИН -->
    <div class="content-area" id="shopScreen">
        <div class="content-title">Улучшения</div>
        <div class="card-item">
            <div class="card-info"><h3>Мультитап</h3><p>Увеличивает силу нажатия</p></div>
            <button class="buy-btn" id="buyClickBtn">50 💰</button>
        </div>
        <div class="card-item">
            <div class="card-info"><h3>Автокликер</h3><p>Добывает монеты автоматически</p></div>
            <button class="buy-btn" id="buyAutoBtn">150 💰</button>
        </div>
        <div class="card-item">
            <div class="card-info"><h3>Турбо-палец</h3><p>Для настоящих мастеров</p></div>
            <button class="buy-btn" id="buySuperBtn">1000 💰</button>
        </div>
    </div>

    <!-- ДОСТИЖЕНИЯ -->
    <div class="content-area" id="achieveScreen">
        <div class="content-title">Награды</div>
        <div id="achievementsList"></div>
    </div>

    <!-- МЕНЮ -->
    <div class="nav-container">
        <div class="nav">
            <div class="nav-btn active" id="navGame">🎮 Игра</div>
            <div class="nav-btn" id="navShop">🛒 Магазин</div>
            <div class="nav-btn" id="navAchieve">🏆 Награды</div>
        </div>
    </div>

    <script>
        // ИСПРАВЛЕННЫЙ ЭКРАН ЗАГРУЗКИ (Не ждет картинок, просто исчезает)
        setTimeout(() => {
            const loader = document.getElementById('loadingScreen');
            if(loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }
        }, 1500);

        // Список ачивок
        const achievementsData = [
            { id: "a_100", title: "Первая сотня", desc: "Накопи 100 монет", reward: 200, type: "score", target: 100 },
            { id: "a_1000", title: "Первая тысяча", desc: "Накопи 1,000 монет", reward: 1000, type: "score", target: 1000 },
            { id: "a_boss", title: "Первый Босс", desc: "Достигни 3 уровня (2,000 монет)", reward: 3000, type: "score", target: 2000 },
            { id: "a_rich", title: "Магнат", desc: "Накопи 50,000 монет", reward: 15000, type: "score", target: 50000 },
            { id: "a_tap_10", title: "Стальной палец", desc: "Прокачай силу клика до 10", reward: 2000, type: "click", target: 10 },
            { id: "a_tap_50", title: "Рука-кувалда", desc: "Прокачай силу клика до 50", reward: 10000, type: "click", target: 50 },
            { id: "a_auto_20", title: "Заводчик", desc: "Прокачай автоклик до 20", reward: 3000, type: "auto", target: 20 },
            { id: "a_auto_100", title: "Скайнет", desc: "Прокачай автоклик до 100", reward: 15000, type: "auto", target: 100 },
            { id: "a_total_500", title: "Маньяк", desc: "Сделай 500 тапов по экрану", reward: 2500, type: "totalClicks", target: 500 },
            { id: "a_secrets_5", title: "Ловец удачи", desc: "Поймай 5 бонусов", reward: 5000, type: "secrets", target: 5 }
        ];

        // Инициализация при старте
        renderAchievements();

        // Переменные прогресса
        let score = parseInt(localStorage.getItem('sg_score_v7')) || 0;
        let clickPower = parseInt(localStorage.getItem('sg_click_v7')) || 1;
        let autoPower = parseInt(localStorage.getItem('sg_auto_v7')) || 0;
        let clickCost = parseInt(localStorage.getItem('sg_clickCost_v7')) || 50;
        let autoCost = parseInt(localStorage.getItem('sg_autoCost_v7')) || 150;
        let superCost = parseInt(localStorage.getItem('sg_superCost_v7')) || 1000;
        
        let totalClicksCounter = parseInt(localStorage.getItem('sg_totalClicks_v7')) || 0;
        let secretsCaught = parseInt(localStorage.getItem('sg_secretsCaught_v7')) || 0;
        
        let unlockedAchieves = [];
        try {
            unlockedAchieves = JSON.parse(localStorage.getItem('sg_achieves_v7')) || [];
        } catch(e) {
            unlockedAchieves = [];
        }

        const levels = [
            { threshold: 0, img: "1.jpg", name: "Новичок" },
            { threshold: 500, img: "2.jpg", name: "Продвинутый" },
            { threshold: 2000, img: "3.jpg", name: "Мастер (Босс)" },
            { threshold: 10000, img: "4.jpg", name: "Легенда" }
        ];

        const scoreText = document.getElementById("scoreText");
        const levelText = document.getElementById("levelText");
        const progressBar = document.getElementById("progressBar");
        const imgEl = document.getElementById("sergeyImg");
        const notifBox = document.getElementById("notifBox");
        
        function saveGame() {
            localStorage.setItem('sg_score_v7', score);
            localStorage.setItem('sg_click_v7', clickPower);
            localStorage.setItem('sg_auto_v7', autoPower);
            localStorage.setItem('sg_clickCost_v7', clickCost);
            localStorage.setItem('sg_autoCost_v7', autoCost);
            localStorage.setItem('sg_superCost_v7', superCost);
            localStorage.setItem('sg_totalClicks_v7', totalClicksCounter);
            localStorage.setItem('sg_secretsCaught_v7', secretsCaught);
            localStorage.setItem('sg_achieves_v7', JSON.stringify(unlockedAchieves));
        }

        function checkAchievements() {
            let changed = false;
            achievementsData.forEach(ach => {
                if (!unlockedAchieves.includes(ach.id)) {
                    let done = false;
                    if (ach.type === "score" && score >= ach.target) done = true;
                    if (ach.type === "click" && clickPower >= ach.target) done = true;
                    if (ach.type === "auto" && autoPower >= ach.target) done = true;
                    if (ach.type === "totalClicks" && totalClicksCounter >= ach.target) done = true;
                    if (ach.type === "secrets" && secretsCaught >= ach.target) done = true;

                    if (done) {
                        unlockedAchieves.push(ach.id);
                        score += ach.reward;
                        changed = true;
                        
                        notifBox.innerText = `🏆 ${ach.title} (+${ach.reward.toLocaleString()} 💰)`;
                        notifBox.classList.add("show");
                        setTimeout(() => notifBox.classList.remove("show"), 3000);
                    }
                }
            });

            if (changed) {
                saveGame(); updateUI(); renderAchievements();
            }
        }

        function renderAchievements() {
            const list = document.getElementById("achievementsList");
            list.innerHTML = "";
            achievementsData.forEach(ach => {
                const isDone = unlockedAchieves.includes(ach.id);
                const div = document.createElement("div");
                div.className = `card-item ${isDone ? 'unlocked' : 'locked'}`;
                
                let progressText = "";
                if(!isDone) {
                    if (ach.type === "totalClicks") progressText = `<br><span style="font-size:11px; color:#a1a1aa">Прогресс: ${totalClicksCounter}/${ach.target}</span>`;
                    if (ach.type === "secrets") progressText = `<br><span style="font-size:11px; color:#a1a1aa">Прогресс: ${secretsCaught}/${ach.target}</span>`;
                }

                div.innerHTML = `
                    <div class="card-info">
                        <h3 style="color: ${isDone ? '#d946ef' : '#fff'}">${ach.title}</h3>
                        <p>${ach.desc} ${progressText}</p>
                    </div>
                    <div class="achieve-status">
                        ${isDone ? '✅' : `🎁 ${ach.reward}`}
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function updateUI() {
            scoreText.innerText = score.toLocaleString();
            document.getElementById("clickPowerText").innerText = `+${clickPower}`;
            document.getElementById("autoPowerText").innerText = `+${autoPower}`;
            
            document.getElementById("buyClickBtn").innerText = `${clickCost.toLocaleString()} 💰`;
            document.getElementById("buyAutoBtn").innerText = `${autoCost.toLocaleString()} 💰`;
            document.getElementById("buySuperBtn").innerText = `${superCost.toLocaleString()} 💰`;

            document.getElementById("buyClickBtn").disabled = score < clickCost;
            document.getElementById("buyAutoBtn").disabled = score < autoCost;
            document.getElementById("buySuperBtn").disabled = score < superCost;

            let curLvl = 0;
            for (let i = levels.length - 1; i >= 0; i--) {
                if (score >= levels[i].threshold) {
                    curLvl = i; imgEl.src = levels[i].img;
                    levelText.innerText = `Ур. ${i + 1} — ${levels[i].name}`; break;
                }
            }

            if (curLvl < levels.length - 1) {
                let perc = ((score - levels[curLvl].threshold) / (levels[curLvl+1].threshold - levels[curLvl].threshold)) * 100;
                progressBar.style.width = `${perc}%`;
            } else {
                progressBar.style.width = "100%";
            }
        }

        function spawnText(x, y, text, color = "#d946ef") {
            const el = document.createElement("div");
            el.className = "floating-text";
            el.innerText = text; el.style.color = color;
            el.style.left = `${x - 20 + (Math.random() - 0.5)*40}px`;
            el.style.top = `${y - 40}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        // КЛИКЕР
        const tapZone = document.getElementById("tapZone");
        tapZone.addEventListener("touchstart", (e) => {
            e.preventDefault(); 
            score += clickPower; 
            totalClicksCounter++; 
            spawnText(e.touches[0].clientX, e.touches[0].clientY, `+${clickPower}`);
            saveGame(); updateUI(); checkAchievements();
        }, {passive: false});
        
        tapZone.addEventListener("mousedown", (e) => {
            score += clickPower; 
            totalClicksCounter++; 
            spawnText(e.clientX, e.clientY, `+${clickPower}`);
            saveGame(); updateUI(); checkAchievements();
        });

        // ПОКУПКИ
        document.getElementById("buyClickBtn").onclick = () => {
            if (score >= clickCost) {
                score -= clickCost; clickPower += 1; clickCost = Math.floor(clickCost * 1.3);
                saveGame(); updateUI(); checkAchievements();
            }
        };
        document.getElementById("buyAutoBtn").onclick = () => {
            if (score >= autoCost) {
                score -= autoCost; autoPower += 2; autoCost = Math.floor(autoCost * 1.3);
                saveGame(); updateUI(); checkAchievements();
            }
        };
        document.getElementById("buySuperBtn").onclick = () => {
            if (score >= superCost) {
                score -= superCost; clickPower += 5; superCost = Math.floor(superCost * 1.5);
                saveGame(); updateUI(); checkAchievements();
            }
        };

        // Вкладки
        const tabs = ["navGame", "navShop", "navAchieve"];
        const screens = ["gameScreen", "shopScreen", "achieveScreen"];
        function switchTab(activeTabId, activeScreenId) {
            tabs.forEach(tab => document.getElementById(tab).classList.remove("active"));
